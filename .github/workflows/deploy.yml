name: Local Deployment Pipeline

on:
  push:
    branches: [ main, develop, deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: warehouse-path-finder

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          docker build -t warehouse-path-finder:${{ github.sha }} .
          docker build -t warehouse-path-finder:latest .

      - name: Run Container Tests
        run: |
          docker run --rm warehouse-path-finder:${{ github.sha }} \
            python -c "import streamlit, numpy, PIL, scipy, cairosvg; print('✓ All dependencies OK')"

      - name: Test Container Startup
        run: |
          docker run --rm -d -p 8010:8010 --name test-container warehouse-path-finder:latest
          sleep 5
          curl -f http://localhost:8010 || echo "Health check: App starting..."
          docker stop test-container || true

  scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety bandit

      - name: Run Safety Check
        run: safety check --json || echo "Safety check completed with warnings"

      - name: Run Bandit Security Scan
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: bandit-report.json
        if: always()

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [ test, scan ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-local:
    name: Deploy to Local Environment
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: docker build -t warehouse-path-finder:latest .

      - name: Prepare Deployment
        run: |
          mkdir -p uploads
          cp .env.example .env || true

      - name: Start Application
        run: |
          docker-compose up -d
          sleep 5

      - name: Health Check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8010; then
              echo "✓ Application is healthy"
              exit 0
            fi
            echo "Attempt $i: Waiting for application..."
            sleep 2
          done
          echo "✗ Health check failed"
          docker-compose logs
          exit 1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: deployment-logs
          path: docker-compose logs

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [ build-and-push, deploy-local ]
    if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create Summary
        run: |
          echo "## Warehouse Path Finder Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Push: ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Local Deploy: ${{ needs.deploy-local.result }}" >> $GITHUB_STEP_SUMMARY
