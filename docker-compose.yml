version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8090:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--httpPort=8080
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - warehouse-network

  warehouse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-path-finder
    ports:
      - "8010:8010"
    environment:
      - STREAMLIT_SERVER_PORT=8010
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8010"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - warehouse-network

networks:
  warehouse-network:
    driver: bridge

volumes:
  jenkins_home:
